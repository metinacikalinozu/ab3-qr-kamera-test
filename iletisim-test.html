
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>AB3 İletişim Testi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .panel {
      max-width: 520px;
      margin: 35px auto;
      padding: 26px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px #00000015;
    }
    h1 { color: #17365d; }
    .uyari { color: #a15c00; font-weight: bold; }
    .durum {
      padding: 16px;
      background: #eef3fa;
      border-radius: 8px;
      margin: 18px 0;
      line-height: 1.6;
    }
    iframe {
      width: 100%;
      height: 460px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
    }
    .bilgi {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ÖzÜ Spor Okulu</h1>
    <h2>AB3 İletişim Testi</h2>

    <p class="uyari">
      TEST MODU - GİRİŞ YETKİSİ VERİLMEZ
    </p>

    <div id="durum" class="durum" role="status">
      Apps Script test ekranı yükleniyor...
    </div>

    <iframe
      id="ab3Test"
      title="AB3 Apps Script İletişim Testi"
      referrerpolicy="no-referrer"
      src="https://script.google.com/a/macros/ozyegin.edu.tr/s/AKfycbxN6mdN8mSSHqfvW-KfAYOXAc1GwPeXxK69-RzlPBbZkX3Oa66pn6FTEEY_WicIpXs/exec?page=kimliktest">
    </iframe>

    <p class="bilgi">
      Bu sayfa yalnızca sabit test mesajlarını kontrol eder.
      Google kimlik belirteci, QR kodu veya kişisel bilgi
      gönderilmez. Gerçek giriş yetkisi verilmez.
    </p>
  </main>

  <script>
    "use strict";

    const durum = document.getElementById("durum");
    const cerceve = document.getElementById("ab3Test");

    // Bu liste yalnızca mesaj kaynağını kontrol etmek
    // içindir. Kimlik doğrulaması veya yetki sağlamaz.
    const izinliKaynaklar = new Set([
      "https://script.google.com",
      "https://script.googleusercontent.com"
    ]);

    window.addEventListener("message", function(event) {
      if (!izinliKaynaklar.has(event.origin)) return;

      // Apps Script'in iç içe iframe yapısı nedeniyle
      // mesajın kaynağı burada ayrıca test edilecektir.
      // Bu mesaj hiçbir yetkilendirme işlemi başlatmaz.
      const veri = event.data;

      if (
        !veri ||
        veri.sistem !== "AB3_QR_TEST" ||
        veri.tur !== "ILETISIM_TESTI" ||
        veri.testModu !== true ||
        veri.girisIzni !== false
      ) {
        return;
      }

      durum.textContent =
        "Apps Script test mesajı alındı. " +
        "Bu sonuç kimlik doğrulaması değildir.";

      // Henüz otomatik yanıt gönderilmiyor.
      // Önce mesajın gerçekten ulaştığını göreceğiz.
    });

    cerceve.addEventListener("load", function() {
      if (durum.textContent.includes("yükleniyor")) {
        durum.textContent =
          "Çerçeve yükleme işlemi tamamlandı. " +
          "Apps Script ekranının görüntülenip " +
          "görüntülenmediğini kontrol edin.";
      }
    });
  </script>
</body>
</html>
