
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>AB3 QR Kamera Testi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .panel {
      max-width: 460px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #00000015;
    }

    h1 {
      color: #17365d;
    }

    button {
      background: #17365d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      margin: 8px 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #929aa8;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
      background: #000;
    }

    #hata {
      color: #b42318;
      overflow-wrap: anywhere;
    }

    .uyari {
      color: #a15c00;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>ÖzÜ Spor Okulu</h1>
    <h2>AB3 Kamera Testi</h2>

    <p class="uyari">
      TEST MODU - GİRİŞ YETKİSİ VERİLMEZ
    </p>

    <button id="ac" onclick="kameraAc()">
      Kamerayı Aç
    </button>

    <button id="kapat"
            onclick="kameraKapat()"
            disabled>
      Kamerayı Kapat
    </button>

    <video id="video"
           autoplay
           muted
           playsinline
           style="display:none;">
    </video>

    <p id="durum">Kamera kapalı.</p>
    <p id="hata"></p>

    <p>
      Bu sayfa yalnızca kamera erişimini test eder.
      QR kodu okumaz ve hiçbir veriyi sunucuya göndermez.
    </p>
  </main>

  <script>
    let akis = null;

    async function kameraAc() {
      const video = document.getElementById('video');
      const durum = document.getElementById('durum');
      const hataAlani = document.getElementById('hata');
      const ac = document.getElementById('ac');
      const kapat = document.getElementById('kapat');

      if (akis) return;

      hataAlani.textContent = '';

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        durum.textContent = 'Kamera API kullanılamıyor.';
        return;
      }

      ac.disabled = true;
      durum.textContent = 'Kamera başlatılıyor...';

      try {
        akis = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' }
          }
        });

        video.srcObject = akis;
        video.style.display = 'block';
        await video.play();

        kapat.disabled = false;
        durum.textContent = 'Kamera başarıyla açıldı.';

      } catch (hata) {
        kameraKapat();
        durum.textContent = 'Kamera açılamadı.';
        hataAlani.textContent =
          'Hata: ' + (hata.name || 'Bilinmiyor') +
          ' - ' + (hata.message || 'Açıklama yok');
      }
    }

    function kameraKapat() {
      if (akis) {
        akis.getTracks().forEach(iz => iz.stop());
        akis = null;
      }

      const video = document.getElementById('video');
      video.pause();
      video.srcObject = null;
      video.style.display = 'none';

      document.getElementById('ac').disabled = false;
      document.getElementById('kapat').disabled = true;
      document.getElementById('durum').textContent =
        'Kamera kapalı.';
    }

    window.addEventListener('pagehide', kameraKapat);
  </script>
</body>
</html>
